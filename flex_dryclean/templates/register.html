{% extends 'base.html' %}
{% block title %}إنشاء حساب — FLEX{% endblock %}
{% block content %}<section class="auth-wrap"><form method="post" class="auth-card"><img class="auth-logo" src="{{ url_for('static',filename='flex-logo-light.png') }}" alt="FLEX"><h1>إنشاء حساب مغسلة</h1><p>ابدأ بإدخال البيانات الأساسية، ويمكن تعديلها لاحقًا.</p><label>اسم المغسلة<input name="business_name" required autofocus></label><label>اسم صاحب المغسلة<input name="full_name" required></label><label>رقم الهاتف<div class="phone-field"><select name="phone_prefix" aria-label="المقدمة الدولية"><option value="00970">00970</option><option value="00972">00972</option></select><input name="phone" inputmode="tel" autocomplete="username" placeholder="59XXXXXXX" required></div></label><label>كلمة المرور<input name="password" type="password" minlength="12" pattern="(?=.*[A-Z])(?=.*[A-Za-z])(?=.*\d).{12,}" autocomplete="new-password" required><small class="password-hint">12 خانة على الأقل، تتضمن حرفاً ورقماً وحرفاً إنجليزياً كبيراً.</small></label><button class="primary full">إنشاء الحساب</button><a href="{{ url_for('login') }}">لديك حساب؟ سجل الدخول</a></form></section>{% endblock %}
