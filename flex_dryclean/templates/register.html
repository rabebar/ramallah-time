{% extends 'base.html' %}
{% block title %}إنشاء حساب — FLEX{% endblock %}
{% block content %}<section class="auth-wrap"><form method="post" class="auth-card"><img class="auth-logo" src="{{ url_for('static',filename='flex-logo-light.png') }}" alt="FLEX"><h1>إنشاء حساب مغسلة</h1><p>ابدأ بإدخال البيانات الأساسية، ويمكن تعديلها لاحقًا.</p><label>اسم المغسلة<input name="business_name" required autofocus></label><label>اسم صاحب المغسلة<input name="full_name" required></label><label>رقم الهاتف<input name="phone" inputmode="tel" autocomplete="username" required></label><label>كلمة المرور<input name="password" type="password" minlength="8" autocomplete="new-password" required></label><button class="primary full">إنشاء الحساب</button><a href="{{ url_for('login') }}">لديك حساب؟ سجل الدخول</a></form></section>{% endblock %}
