{% extends 'base.html' %}
{% block title %}الخدمات والأسعار — FLEX{% endblock %}
{% block content %}
<section class="hero-row"><div><span class="eyebrow">إعدادات المغسلة</span><h1>الخدمات والأسعار</h1><p>الأسعار الجديدة تطبق على الطلبات الجديدة فقط.</p></div><button class="primary" data-open="add-service">+ إضافة خدمة</button></section>
<div class="panel"><div class="table-wrap"><table><thead><tr><th>القسم</th><th>الخدمة</th><th>الوحدة</th><th>السعر</th><th>متاحة</th><th></th></tr></thead><tbody>{% for service in services %}<tr><form method="post" action="{{ url_for('edit_service',service_id=service.id) }}"><td><input name="category" value="{{ service.category }}" required></td><td><input name="name" value="{{ service.name }}" required></td><td><select name="unit">{% for unit in ['قطعة','كيلو','متر','متر مربع'] %}<option {{ 'selected' if service.unit==unit }}>{{ unit }}</option>{% endfor %}</select></td><td><input name="price" type="number" step="0.01" min="0" value="{{ service.price }}" required></td><td><input name="active" type="checkbox" {{ 'checked' if service.active }}></td><td><button class="soft">حفظ</button></td></form></tr>{% endfor %}</tbody></table></div></div>
<dialog id="add-service"><form method="post" action="{{ url_for('add_service') }}" class="modal-card small"><div class="modal-head"><h2>خدمة جديدة</h2><button type="button" class="icon-close" data-close>×</button></div><label>القسم<input name="category" placeholder="ملابس" required></label><label>اسم الخدمة<input name="name" required></label><label>وحدة الحساب<select name="unit"><option>قطعة</option><option>كيلو</option><option>متر</option><option>متر مربع</option></select></label><label>السعر<input name="price" type="number" step="0.01" min="0" required></label><button class="primary full">إضافة</button></form></dialog>
{% endblock %}
