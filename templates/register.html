<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب تاجر | RT Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --navy: #0A192F;
            --navy-light: #112240;
            --gold: #B8974A;
            --white: #FFFFFF;
            --gray-bg: #F8FAFC;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --border: rgba(0, 0, 0, 0.06);
        }

        body { 
            background: var(--navy); 
            color: var(--white); 
            font-family: 'IBM Plex Sans Arabic', 'Inter', sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 40px 20px;
            background-image: radial-gradient(circle at 20% 30%, rgba(184, 151, 74, 0.05) 0%, transparent 50%),
                              radial-gradient(circle at 80% 70%, rgba(184, 151, 74, 0.05) 0%, transparent 50%);
        }

        .register-card { 
            text-align: center; 
            background: var(--navy-light); 
            padding: 50px 40px; 
            border-radius: 28px; 
            width: 100%;
            max-width: 420px; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .logo-box { 
            width: 60px; height: 60px; 
            background: var(--gold); 
            border-radius: 16px; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: 800; font-size: 24px; color: var(--navy); 
            margin: 0 auto 25px; 
            box-shadow: 0 8px 20px rgba(184, 151, 74, 0.3);
        }

        h2 { font-weight: 700; margin-bottom: 8px; font-size: 26px; color: var(--white); }
        p { color: rgba(255, 255, 255, 0.6); font-size: 15px; margin-bottom: 35px; }

        .form-group { text-align: right; margin-bottom: 20px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--gold); text-transform: uppercase; letter-spacing: 0.5px; }

        input { 
            padding: 16px; width: 100%; border-radius: 14px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            background: rgba(255, 255, 255, 0.03); color: var(--white); 
            box-sizing: border-box; outline: none; 
            font-size: 16px; transition: all 0.3s;
        }
        input:focus { border-color: var(--gold); background: rgba(255, 255, 255, 0.05); box-shadow: 0 0 0 4px rgba(184, 151, 74, 0.1); }

        button { 
            padding: 16px; width: 100%; 
            background: var(--gold); color: var(--navy); 
            border: none; border-radius: 14px; 
            cursor: pointer; font-weight: 800; font-size: 16px; 
            transition: all 0.3s; margin-top: 15px; 
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        button:hover { background: #c9a65a; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(184, 151, 74, 0.3); }

        .pending-notice {
            background: rgba(184, 151, 74, 0.05); border: 1px solid rgba(184, 151, 74, 0.1); color: var(--gold);
            padding: 16px; border-radius: 14px; font-size: 13px; margin-top: 25px;
            text-align: right; line-height: 1.6;
            display: flex; gap: 12px;
        }
        .pending-notice i { flex-shrink: 0; }

        .footer-link { margin-top: 30px; font-size: 14px; color: rgba(255, 255, 255, 0.5); }
        .footer-link a { color: var(--gold); text-decoration: none; font-weight: 700; transition: 0.2s; }
        .footer-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="register-card">
        <div class="logo-box">RT</div>
        <h2>ابدأ متجرك الآن</h2>
        <p>انضم إلى منصة RT Studio لتصميم صور منتجاتك باحترافية</p>
        
        <form method="POST">
            <div class="form-group">
                <label>اسم المتجر</label>
                <input type="text" name="store_name" placeholder="مثال: بوتيك الأناقة" required>
            </div>

            <div class="form-group">
                <label>رقم الجوال</label>
                <div style="display: flex; gap: 8px;">
                    <select name="phone_prefix" style="width: 100px; padding: 16px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.03); color: #fff; font-weight: 600; outline: none; -webkit-appearance: none;">
                        <option value="970" selected>+970</option>
                        <option value="972">+972</option>
                        <option value="962">+962</option>
                    </select>
                    <input type="text" name="phone" placeholder="5xxxxxxxx" style="flex: 1;" required>
                </div>
            </div>

            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" name="password" placeholder="اختر كلمة مرور قوية" required>
            </div>

            <button type="submit">
                إرسال طلب الانضمام
                <i data-lucide="user-plus" style="width: 18px; height: 18px;"></i>
            </button>
        </form>

        <div class="pending-notice">
            <i data-lucide="info" style="width: 20px; height: 20px;"></i>
            <div>سيتم مراجعة طلبك وتفعيل حسابك من قبل الإدارة خلال 24 ساعة.</div>
        </div>

        <div class="footer-link">
            لديك حساب بالفعل؟ <a href="/login">تسجيل الدخول</a>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
