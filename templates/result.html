<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Design Lab | Ramallah Time</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-app: #f3f5f7;
            --bg-sidebar: #ffffff;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --accent: #4f46e5;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-app); 
            color: var(--text-main); 
            display: flex; 
            min-height: 100vh; 
            overflow-x: hidden;
            overscroll-behavior: none;
        }

        /* === Desktop Sidebar === */
        .sidebar {
            width: 320px; 
            background: var(--bg-sidebar); 
            border-right: 1px solid var(--border);
            padding: 30px; 
            height: 100vh; 
            position: sticky; top: 0;
            flex-shrink: 0;
            display: flex; flex-direction: column;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            overflow-y: auto;
        }

        .logo-area { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; }
        .logo-box { width: 40px; height: 40px; background: var(--accent); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #fff; font-size: 20px; }
        
        .main-title { font-size: 22px; font-weight: 800; color: var(--text-main); margin-bottom: 5px; }
        .sub-title { font-size: 13px; color: var(--text-muted); margin-bottom: 30px; }

        /* === Main Preview Area === */
        .lab-viewport {
            flex-grow: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
        }

        .preview-card {
            width: 100%;
            max-width: 500px;
            background: #fff;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .canvas-container {
            width: 100%; aspect-ratio: 1/1;
            background: linear-gradient(160deg, #fdfbf7 0%, #e2d9ca 100%);
            border-radius: 12px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            position: relative; overflow: hidden;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        #live-img { 
            max-width: 70%; max-height: 60%; object-fit: contain; 
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.1)); 
            margin-bottom: 15px; 
            transition: all 0.3s ease;
        }
        #live-title { font-family: 'Cairo'; font-size: 24px; font-weight: 900; color: #2c2c2c; margin-bottom: 8px; text-align: center; transition: all 0.3s ease; }
        #live-divider { width: 60px; height: 4px; background: #b5935f; border-radius: 2px; margin-bottom: 8px; transition: all 0.3s ease; }
        #live-price { font-family: 'Cairo'; font-size: 18px; font-weight: 700; color: #555; transition: all 0.3s ease; }
        .watermark { position: absolute; bottom: 10px; font-size: 8px; color: rgba(0,0,0,0.1); letter-spacing: 2px; font-weight: 700; }

        /* === Layout Styles Preview Logic === */
        /* 1. Modern */
        .layout-modern { background: #F2F0ED; }
        .layout-modern #live-img { margin-bottom: 0; }
        .layout-modern #live-title { position: absolute; top: 20px; right: 20px; font-size: 18px; text-align: right; }
        .layout-modern #live-divider { display: none; }
        .layout-modern #live-price { position: absolute; bottom: 20px; left: 20px; background: #fff; padding: 8px 15px; border-radius: 20px; font-size: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        /* 2. Minimal */
        .layout-minimal { background: #111; justify-content: flex-end; }
        .layout-minimal #live-img { position: absolute; top: 20px; max-width: 80%; max-height: 60%; margin: 0; opacity: 0.8; }
        .layout-minimal #live-title { position: absolute; bottom: 40px; right: 20px; color: #fff; font-size: 18px; text-align: right; }
        .layout-minimal #live-divider { display: none; }
        .layout-minimal #live-price { position: absolute; bottom: 40px; left: 20px; color: #fff; font-size: 14px; background: rgba(255,255,255,0.1); padding: 5px 10px; border-radius: 4px; }

        /* 3. Bold */
        .layout-bold { background: #f7f3ee; flex-direction: row; padding: 0; }
        .layout-bold #live-img { position: absolute; left: 0; bottom: 0; width: 55%; height: 100%; max-width: none; max-height: none; object-fit: cover; margin: 0; }
        .layout-bold #live-title { position: absolute; right: 20px; top: 40%; color: #fff; font-size: 18px; text-align: right; transform: translateY(-50%); background: #000; padding: 10px; }
        .layout-bold #live-divider { position: absolute; right: 20px; top: 60%; background: #fff; transform: translateY(-50%); }
        .layout-bold #live-price { position: absolute; right: 20px; bottom: 40px; background: #fff; color: #000; padding: 8px 15px; border-radius: 4px; font-size: 14px; }
        /* خلفية سوداء للجهة اليمنى في Bold */
        .layout-bold::after { content: ''; position: absolute; right: 0; top: 0; width: 50%; height: 100%; background: #000; z-index: 0; }

        /* === Controls === */
        .control-group { margin-bottom: 25px; }
        .group-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px; display: block; }
        
        .options-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .opt-btn { background: #f9fafb; border: 1px solid var(--border); padding: 12px 5px; border-radius: 10px; text-align: center; cursor: pointer; transition: 0.2s; }
        .opt-btn:hover { border-color: var(--accent); background: #f3f4f6; }
        .opt-btn.active { border-color: var(--accent); background: rgba(79, 70, 229, 0.1); box-shadow: 0 0 0 1px var(--accent); }
        .opt-icon { font-size: 18px; margin-bottom: 4px; display: block; }
        .opt-name { font-size: 10px; font-weight: 600; color: var(--text-main); }

        input, textarea {
            width: 100%; background: #f9fafb;
            border: 1px solid var(--border);
            padding: 12px; border-radius: 10px;
            color: var(--text-main); margin-bottom: 10px;
            font-size: 14px; outline: none;
            font-family: 'Cairo';
            transition: 0.2s;
        }
        input:focus, textarea:focus { border-color: var(--accent); background: #fff; }
        
        .btn-main { background: var(--text-main); color: #fff; border: none; padding: 14px; border-radius: 10px; width: 100%; font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 14px; }
        .btn-main:hover { opacity: 0.9; }
        .btn-outline { background: transparent; border: 2px solid var(--text-main); color: var(--text-main); padding: 12px; border-radius: 10px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 8px; font-size: 14px; }

        /* === Mobile Responsive === */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { 
                position: fixed; bottom: 0; left: 0; right: 0;
                width: 100%; height: auto; max-height: 70vh; 
                border-right: none; border-top: 1px solid var(--border);
                border-radius: 20px 20px 0 0; 
                padding: 20px;
                z-index: 100;
                overflow-y: auto;
                display: none; 
            }
            .sidebar.active { display: block; }
            
            .lab-viewport { padding: 20px; padding-bottom: 100px; }
            
            .mobile-toggle {
                position: fixed; bottom: 20px; right: 20px;
                width: 60px; height: 60px; border-radius: 50%;
                background: var(--accent); color: #fff;
                border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
                font-size: 24px; cursor: pointer; z-index: 101;
                display: flex; align-items: center; justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="sidebar" id="controlsPanel">
        <div class="logo-area">
            <div class="logo-box">RT</div>
            <div>
                <div class="main-title">Design Lab</div>
                <div class="sub-title">Customize your product</div>
            </div>
        </div>

        <!-- Controls Content -->
        <div class="control-group">
            <span class="group-label">🎨 Theme</span>
            <div class="options-grid">
                <div class="opt-btn active" onclick="setTheme('gold', this)"><span class="opt-icon">✨</span><span class="opt-name">Royal</span></div>
                <div class="opt-btn" onclick="setTheme('black', this)"><span class="opt-icon">🖤</span><span class="opt-name">Night</span></div>
                <div class="opt-btn" onclick="setTheme('fire', this)"><span class="opt-icon">🔥</span><span class="opt-name">Fire</span></div>
                <div class="opt-btn" onclick="setTheme('ocean', this)"><span class="opt-icon">🌊</span><span class="opt-name">Ocean</span></div>
                <div class="opt-btn" onclick="setTheme('pastel', this)"><span class="opt-icon">🦋</span><span class="opt-name">Pastel</span></div>
                <div class="opt-btn" onclick="setTheme('spring', this)"><span class="opt-icon">🌿</span><span class="opt-name">Fresh</span></div>
            </div>
        </div>

        <!-- ✅ تعديل: 4 خيارات للستايل -->
        <div class="control-group">
            <span class="group-label">📐 Layout Style</span>
            <div class="options-grid" style="grid-template-columns: repeat(2, 1fr);">
                <div class="opt-btn active" onclick="setLayout('elegant', this)"><span class="opt-icon">🖼️</span><span class="opt-name">Classic</span></div>
                <div class="opt-btn" onclick="setLayout('modern', this)"><span class="opt-icon">💎</span><span class="opt-name">Modern</span></div>
                <div class="opt-btn" onclick="setLayout('minimal', this)"><span class="opt-icon">🎯</span><span class="opt-name">Minimal</span></div>
                <div class="opt-btn" onclick="setLayout('bold', this)"><span class="opt-icon">⚡</span><span class="opt-name">Bold</span></div>
            </div>
        </div>

        <div class="control-group">
            <span class="group-label">✍️ Details</span>
            <input type="text" id="inName" placeholder="Product Name..." oninput="sync()">
            <input type="text" id="inPrice" placeholder="Price (₪)..." oninput="sync()">
            <textarea id="inDesc" placeholder="Description..." oninput="sync()" style="min-height: 60px;"></textarea>
        </div>

        <form action="/save_product" method="POST">
            <input type="hidden" name="original_image" value="{{ original }}">
            <input type="hidden" name="processed_image" value="{{ processed }}">
            <input type="hidden" name="name" id="fName">
            <input type="hidden" name="price" id="fPrice">
            <input type="hidden" name="description" id="fDesc">
            <input type="hidden" name="template_style" id="fStyle" value="elegant">
            <input type="hidden" name="theme" id="fTheme" value="gold">
            
            <button type="submit" class="btn-outline" style="margin-top:0;">💾 Save to Store</button>
        </form>
        <button class="btn-main" onclick="downloadDesign()">📥 Download Image</button>
    </div>

    <!-- Main Viewport -->
    <div class="lab-viewport">
        <div class="preview-card">
            <div class="canvas-container" id="post-canvas">
                <img id="live-img" src="/static/uploads/{{ processed }}" alt="">
                <div id="live-title">Product Name</div>
                <div id="live-divider"></div>
                <div id="live-price">0.00 ₪</div>
                <div class="watermark">RAMALLAH TIME</div>
            </div>
        </div>
    </div>

    <!-- Mobile Toggle Button -->
    <button class="mobile-toggle" onclick="toggleControls()" style="display:none;">⚙️</button>

    <script>
        function toggleControls() {
            document.getElementById('controlsPanel').classList.toggle('active');
        }

        if(window.innerWidth <= 768) {
            document.querySelector('.mobile-toggle').style.display = 'flex';
            document.getElementById('controlsPanel').classList.remove('active');
        }

        const themes = {
            gold:   { bg: 'linear-gradient(160deg, #fdfbf7 0%, #e2d9ca 100%)', text: '#2c2c2c', price: '#555', line: '#b5935f' },
            black:  { bg: 'linear-gradient(160deg, #1a1a1a 0%, #434343 100%)', text: '#ffffff', price: '#e0e0e0', line: '#ffffff' },
            fire:   { bg: 'linear-gradient(160deg, #fff5f5 0%, #fed7d7 100%)', text: '#742a2a', price: '#c53030', line: '#fc8181' },
            ocean:  { bg: 'linear-gradient(160deg, #ebf8ff 0%, #bee3f8 100%)', text: '#1a365d', price: '#2b6cb0', line: '#63b3ed' },
            pastel: { bg: 'linear-gradient(160deg, #fdf2f8 0%, #ebf5fb 100%)', text: '#2c3e50', price: '#7f8c8d', line: '#bdc3c7' },
            spring: { bg: 'linear-gradient(160deg, #f0fff4 0%, #c6f6d5 100%)', text: '#1a3c2a', price: '#276749', line: '#48bb78' }
        };

        function setTheme(key, el) {
            const t = themes[key];
            const canvas = document.getElementById('post-canvas');
            // نطبق الألوان على العناصر الداخلية فقط، لا نغير الـ Layout Class
            canvas.style.background = t.bg;
            document.getElementById('live-title').style.color = t.text;
            document.getElementById('live-price').style.color = t.price;
            document.getElementById('live-divider').style.background = t.line;
            
            document.getElementById('fTheme').value = key;
            updateActive(el);
        }

        function setLayout(layout, el) {
            const canvas = document.getElementById('post-canvas');
            // نحذف كلاسات الـ Layout القديمة ونضيف الجديدة
            canvas.className = 'canvas-container layout-' + layout;
            // نعيد تطبيق ألوان الثيم الحالي لأن تغيير الكلاس قد يعيد تعريف بعض الألوان
            // (هذا حل بسيط لضمان التناسق)
            
            document.getElementById('fStyle').value = layout;
            updateActive(el);
        }

        function updateActive(el) {
            el.closest('.options-grid').querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        function sync() {
            const name = document.getElementById('inName').value || 'Product Name';
            const price = document.getElementById('inPrice').value || '0.00';
            document.getElementById('live-title').innerText = name;
            document.getElementById('live-price').innerText = price + ' ₪';
            document.getElementById('fName').value = name;
            document.getElementById('fPrice').value = price;
            document.getElementById('fDesc').value = document.getElementById('inDesc').value;
        }

        function downloadDesign() {
            const canvas = document.getElementById('post-canvas');
            html2canvas(canvas, { scale: 3, useCORS: true }).then(c => {
                const link = document.createElement('a');
                link.download = 'RT_Design_' + Date.now() + '.jpg';
                link.href = c.toDataURL('image/jpeg', 0.9);
                link.click();
            });
        }
    </script>
</body>
</html>
