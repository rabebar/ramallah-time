<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <link rel="manifest" href="/static/manifest.json">
    <title>{{ store.name }} | Official Store</title>
    
    <!-- Fonts: Playfair Display for Luxury Titles, Inter for UI -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Reset & Variables */
        :root {
            --bg-page: #ffffff;
            --text-main: #000000;
            --text-muted: #666666;
            --border: #eeeeee;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-page); color: var(--text-main); }

        /* --- Luxury Header (Sticky on Mobile) --- */
        .luxury-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 999;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-logo {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #000;
            text-decoration: none;
        }
        .header-icons a { margin-left: 15px; color: #000; text-decoration: none; font-size: 12px; font-weight: 500; }
        .header-icons a svg { display: none; } /* Simple text links for now */

        /* --- Hero Section --- */
        .hero-section {
            text-align: center;
            padding: 60px 20px 40px;
            border-bottom: 1px solid var(--border);
        }
        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            font-weight: 400;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }
        .hero-subtitle {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* --- Product Grid (Minimalist) --- */
        .collection-wrapper { max-width: 1400px; margin: 0 auto; padding: 40px 24px 100px; }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 40px;
        }

        .product-card {
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .product-card:hover { transform: translateY(-5px); }

        /* The Image Container */
        .card-image-wrap {
            width: 100%; aspect-ratio: 1/1;
            background: #f8f8f8; /* Light gray background for contrast */
            margin-bottom: 15px;
            overflow: hidden;
            position: relative;
        }
        .card-image-wrap img {
            width: 100%; height: 100%;
            object-fit: cover; /* Cover looks better for gallery style */
            transition: opacity 0.3s;
        }
        .product-card:hover img { opacity: 0.9; }

        /* Product Details */
        .card-info { text-align: left; }
        .card-brand {
            font-size: 10px; color: #999; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px;
        }
        .card-name {
            font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 500;
            color: #000; margin-bottom: 8px;
        }
        .card-price {
            font-size: 14px; color: #000; font-weight: 400;
        }

        /* --- Modal (Product View) --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.98);
            display: none; align-items: center; justify-content: center;
            z-index: 10000; padding: 20px;
        }
        .modal-card {
            background: #fff; width: 100%; max-width: 450px;
            border-radius: 0; overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            position: relative; border: 1px solid #eee;
        }
        
        /* Canvas Area inside Modal (Reuse Theme Logic) */
        .modal-canvas-area {
            width: 100%; aspect-ratio: 1/1;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            position: relative; overflow: hidden;
            transition: background 0.4s ease; color: #fff;
        }
        .modal-canvas-area img { max-width: 80%; max-height: 70%; object-fit: contain; filter: drop-shadow(0 15px 30px rgba(0,0,0,0.3)); }
        .modal-canvas-area .m-prod-name { font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 700; margin-top: 15px; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
        .modal-canvas-area .m-prod-price { font-size: 18px; font-weight: 600; opacity: 0.9; }
        .modal-canvas-area .divider { width: 40px; height: 3px; background: #fff; margin: 12px 0; border-radius: 2px; opacity: 0.8; }

        /* Styles in Modal */
        .modal-canvas-area.style-modern .m-prod-name { position: absolute; top: 24px; right: 24px; font-size: 20px; text-align: right; width: 70%; }
        .modal-canvas-area.style-modern .m-prod-price { position: absolute; bottom: 24px; left: 24px; background: #fff; color: #111; padding: 8px 20px; border-radius: 50px; font-weight: 700; }
        .modal-canvas-area.style-modern img { max-width: 70%; }
        .modal-canvas-area.style-minimal { justify-content: flex-end; }
        .modal-canvas-area.style-minimal img { position: absolute; top: 15%; max-height: 60%; }
        .modal-canvas-area.style-minimal .glass-footer { position: absolute; bottom: 0; width: 100%; background: rgba(255,255,255,0.15); backdrop-filter: blur(20px); padding: 20px 30px; display: flex; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.2); }
        .modal-canvas-area.style-bold { flex-direction: row; justify-content: flex-start; }
        .modal-canvas-area.style-bold img { width: 65%; max-height: 100%; object-fit: cover; margin-right: -15%; z-index: 2; }
        .modal-canvas-area.style-bold .side-info { background: rgba(0,0,0,0.25); height: 100%; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; padding: 30px; text-align: right; backdrop-filter: blur(5px); }

        .modal-actions { padding: 30px; text-align: center; }
        .whatsapp-btn {
            display: block; width: 100%; padding: 18px;
            background: #000; color: #fff; text-decoration: none;
            font-size: 14px; font-weight: 600; letter-spacing: 1px;
            transition: background 0.2s;
        }
        .whatsapp-btn:hover { background: #333; }
        
        .close-modal-btn {
            position: absolute; top: 15px; left: 15px;
            width: 36px; height: 36px; border-radius: 50%;
            background: #fff; border: 1px solid #eee;
            display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 11;
        }

        /* PWA Banner */
        .install-banner {
            position: fixed; bottom: 20px; left: 20px; right: 20px; max-width: 360px; margin: 0 auto;
            background: #000; color: #fff; padding: 16px 20px; border-radius: 2px;
            display: none; align-items: center; justify-content: space-between;
            z-index: 1001; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .install-btn { background: #fff; color: #000; border: none; padding: 8px 16px; font-weight: 600; cursor: pointer; font-size: 12px; }
        
        /* Responsive */
        @media (max-width: 768px) {
            .hero-title { font-size: 28px; }
            .products-grid { gap: 20px; }
        }
    </style>
</head>
<body>

    <!-- Mobile Top Header -->
    <header class="luxury-header">
        <a href="/" class="header-logo">{{ store.name }}</a>
        <div class="header-icons">
            <a href="https://wa.me/{{ store.whatsapp_phone }}">CONTACT</a>
        </div>
    </header>

    <main class="hero-section">
        <h1 class="hero-title">NEW ARRIVALS</h1>
        <p class="hero-subtitle">Exclusive Collection</p>
    </main>

    <div class="collection-wrapper">
        <div class="products-grid">
            {% for product in products %}
            <div class="product-card" 
                 onclick="openProductModal('{{ product.name }}', '{{ product.price }}', '/static/uploads/{{ product.processed_image_url }}', '{{ product.theme or 'gold' }}', '{{ product.template_style or 'elegant' }}')">
                
                <div class="card-image-wrap">
                    <!-- We show the processed image directly -->
                    <img src="/static/uploads/{{ product.processed_image_url }}" alt="{{ product.name }}">
                </div>

                <div class="card-info">
                    <div class="card-brand">RT STUDIO</div>
                    <h3 class="card-name">{{ product.name }}</h3>
                    <div class="card-price">₪{{ product.price }}</div>
                </div>
            </div>
            {% else %}
            <div style="grid-column: 1/-1; text-align: center; padding: 80px 20px; color: #999;">
                <h3 style="font-family:'Playfair Display'; margin-bottom:10px;">No Products Yet</h3>
                <p style="font-size: 14px;">Check back soon for new arrivals.</p>
            </div>
            {% endfor %}
        </div>
    </div>

    <!-- Modal -->
    <div id="pModal" class="modal-overlay" onclick="closeProductModal()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <button class="close-modal-btn" onclick="closeProductModal()">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
            
            <div id="modalCanvas" class="modal-canvas-area theme-gold style-elegant">
                <img id="mImgView" src="" alt="Product Image">
                <div id="mContentWrap"></div>
            </div>

            <div class="modal-actions">
                <a id="mWaLink" href="" class="whatsapp-btn" target="_blank">
                    ORDER VIA WHATSAPP
                </a>
            </div>
        </div>
    </div>

    <!-- PWA Logic -->
    <div id="pwaBanner" class="install-banner">
        <div style="font-size:13px;">Install RT Studio App</div>
        <button id="pwaBtn" class="install-btn">Install</button>
    </div>

    <!-- Themes CSS (Included here for Modal) -->
    <style>
        .theme-gold { background: linear-gradient(135deg, #F2994A, #F2C94C); }
        .theme-black { background: linear-gradient(135deg, #0F2027, #203A43); }
        .theme-pastel { background: linear-gradient(135deg, #667EEA, #764BA2); }
        .theme-spring { background: linear-gradient(135deg, #11998E, #38EF7D); }
        .theme-fire { background: linear-gradient(135deg, #FF512F, #DD2476); }
        .theme-ocean { background: linear-gradient(135deg, #2193B0, #6DD5ED); }
    </style>

    <script>
        // --- Product Modal Logic ---
        function openProductModal(name, price, img, theme, style) {
            const canvas = document.getElementById('modalCanvas');
            const contentWrap = document.getElementById('mContentWrap');
            const storePhone = "{{ store.whatsapp_phone or store.display_phone }}".replace(/\s+/g, '');
            
            document.getElementById('mImgView').src = img;

            // Reset and Apply Classes
            canvas.className = 'modal-canvas-area';
            canvas.classList.add('theme-' + theme);
            canvas.classList.add('style-' + style);

            // Build Layout
            if (style === 'elegant') {
                contentWrap.innerHTML = `<div class="m-prod-name">${name}</div><div class="divider"></div><div class="m-prod-price">₪${price}</div>`;
            } else if (style === 'modern') {
                contentWrap.innerHTML = `<div class="m-prod-name">${name}</div><div class="m-prod-price">₪${price}</div>`;
            } else if (style === 'minimal') {
                contentWrap.innerHTML = `<div class="glass-footer"><div class="m-prod-name">${name}</div><div class="m-prod-price">₪${price}</div></div>`;
            } else if (style === 'bold') {
                contentWrap.innerHTML = `<div class="side-info"><div class="m-prod-name">${name}</div><div class="divider"></div><div class="m-prod-price">₪${price}</div></div>`;
            }

            // WhatsApp
            let message = encodeURIComponent("Hi, I'm interested in: " + name + " (Price: ₪" + price + ").");
            document.getElementById('mWaLink').href = "https://wa.me/" + storePhone + "?text=" + message;
            
            document.getElementById('pModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeProductModal() {
            document.getElementById('pModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        // --- PWA Logic ---
        let deferredPrompt;
        const pwaBanner = document.getElementById('pwaBanner');
        const pwaBtn = document.getElementById('pwaBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            pwaBanner.style.display = 'flex';
        });

        pwaBtn.addEventListener('click', () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => {
                    pwaBanner.style.display = 'none';
                    deferredPrompt = null;
                });
            }
        });
    </script>
</body>
</html>
