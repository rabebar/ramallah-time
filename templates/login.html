<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | RT Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* نظام التصميم الفاتح والنظيف (Canva/Notion Style) */
        :root {
            --bg: #f3f5f7;
            --card: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --accent: #4f46e5;
            --border: #e5e7eb;
        }

        body { 
            background: var(--bg); 
            color: var(--text-main); 
            font-family: 'Inter', 'Cairo', sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            padding: 20px;
        }

        .login-card { 
            text-align: center; 
            background: var(--card); 
            padding: 50px 40px; 
            border-radius: 24px; 
            width: 100%;
            max-width: 380px; 
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        .logo-box { 
            width: 54px; height: 54px; 
            background: var(--accent); 
            border-radius: 14px; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: 900; font-size: 24px; color: #fff; 
            margin: 0 auto 25px; 
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
        }

        h2 { font-family: 'Cairo'; font-weight: 900; margin-bottom: 8px; font-size: 24px; color: #111; }
        p { color: var(--text-muted); font-size: 14px; margin-bottom: 30px; font-family: 'Cairo'; }

        .form-group { text-align: right; margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: #374151; font-family: 'Cairo'; }

        input { 
            padding: 14px; width: 100%; border-radius: 12px; 
            border: 1px solid var(--border); 
            background: #fafafa; color: var(--text-main); 
            box-sizing: border-box; outline: none; 
            font-size: 15px; transition: 0.2s;
            font-family: 'Inter', 'Cairo';
        }
        input:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.05); }

        button { 
            padding: 16px; width: 100%; 
            background: var(--accent); color: white; 
            border: none; border-radius: 12px; 
            cursor: pointer; font-weight: bold; font-size: 16px; 
            transition: 0.3s; margin-top: 10px; 
            font-family: 'Cairo';
        }
        button:hover { background: #4338ca; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2); }

        .footer-link { margin-top: 25px; font-size: 14px; color: var(--text-muted); font-family: 'Cairo'; }
        .footer-link a { color: var(--accent); text-decoration: none; font-weight: 700; }

        /* رسائل الخطأ أو التنبيه */
        .alert { 
            background: #fef2f2; color: #dc2626; 
            padding: 12px; border-radius: 10px; 
            font-size: 13px; margin-bottom: 20px; 
            font-family: 'Cairo'; border: 1px solid #fee2e2;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-box">RT</div>
        <h2>تسجيل الدخول</h2>
        <p>أهلاً بك مجدداً في RT Studio</p>
        
        {% if error %}
        <div class="alert">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label>رقم الجوال</label>
                <input type="text" name="phone" placeholder="059xxxxxxx" required>
            </div>

            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" name="password" placeholder="أدخل كلمة المرور" required>
            </div>

            <button type="submit">دخول للمنصة</button>
        </form>

        <div class="footer-link">
            ليس لديك حساب؟ <a href="/register">أنشئ حسابك الآن</a>
        </div>
    </div>
</body>
</html>
