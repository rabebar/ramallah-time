<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | RT Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --navy: #0A192F;
            --navy-light: #112240;
            --gold: #B8974A;
            --white: #FFFFFF;
            --gray-bg: #F8FAFC;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --border: rgba(0, 0, 0, 0.06);
        }

        body { 
            background: var(--navy); 
            color: var(--white); 
            font-family: 'IBM Plex Sans Arabic', 'Inter', sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            padding: 20px;
            background-image: radial-gradient(circle at 20% 30%, rgba(184, 151, 74, 0.05) 0%, transparent 50%),
                              radial-gradient(circle at 80% 70%, rgba(184, 151, 74, 0.05) 0%, transparent 50%);
        }

        .login-card { 
            text-align: center; 
            background: var(--navy-light); 
            padding: 50px 40px; 
            border-radius: 28px; 
            width: 100%;
            max-width: 400px; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .logo-box { 
            width: 60px; height: 60px; 
            background: var(--gold); 
            border-radius: 16px; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: 800; font-size: 24px; color: var(--navy); 
            margin: 0 auto 25px; 
            box-shadow: 0 8px 20px rgba(184, 151, 74, 0.3);
        }

        h2 { font-weight: 700; margin-bottom: 8px; font-size: 26px; color: var(--white); }
        p { color: rgba(255, 255, 255, 0.6); font-size: 15px; margin-bottom: 35px; }

        .form-group { text-align: right; margin-bottom: 20px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--gold); text-transform: uppercase; letter-spacing: 0.5px; }

        input { 
            padding: 16px; width: 100%; border-radius: 14px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            background: rgba(255, 255, 255, 0.03); color: var(--white); 
            box-sizing: border-box; outline: none; 
            font-size: 16px; transition: all 0.3s;
        }
        input:focus { border-color: var(--gold); background: rgba(255, 255, 255, 0.05); box-shadow: 0 0 0 4px rgba(184, 151, 74, 0.1); }

        button { 
            padding: 16px; width: 100%; 
            background: var(--gold); color: var(--navy); 
            border: none; border-radius: 14px; 
            cursor: pointer; font-weight: 800; font-size: 16px; 
            transition: all 0.3s; margin-top: 15px; 
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        button:hover { background: #c9a65a; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(184, 151, 74, 0.3); }

        .footer-link { margin-top: 30px; font-size: 14px; color: rgba(255, 255, 255, 0.5); }
        .footer-link a { color: var(--gold); text-decoration: none; font-weight: 700; transition: 0.2s; }
        .footer-link a:hover { text-decoration: underline; }

        .alert { 
            background: rgba(239, 68, 68, 0.1); color: #f87171; 
            padding: 14px; border-radius: 12px; 
            font-size: 14px; margin-bottom: 25px; 
            border: 1px solid rgba(239, 68, 68, 0.2);
            display: flex; align-items: center; gap: 10px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-box">RT</div>
        <h2>{% if superadmin %}دخول الإدارة{% else %}تسجيل الدخول{% endif %}</h2>
        <p>{% if superadmin %}مرحباً بك في لوحة التحكم العليا{% else %}أهلاً بك مجدداً في RT Studio{% endif Sev}</p>
        
        {% if error %}
        <div class="alert">
            <i data-lucide="alert-circle" style="width: 18px; height: 18px;"></i>
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            {% if not superadmin %}
            <div class="form-group">
                <label>رقم الجوال</label>
                <input type="text" name="phone" placeholder="059xxxxxxx" required>
            </div>
            {% endif %}

            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" name="password" placeholder="أدخل كلمة المرور" required>
            </div>

            <button type="submit">
                دخول للمنصة
                <i data-lucide="arrow-left" style="width: 18px; height: 18px;"></i>
            </button>
        </form>

        <div class="footer-link">
            ليس لديك حساب؟ <a href="/register">أنشئ حسابك الآن</a>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
