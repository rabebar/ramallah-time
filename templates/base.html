<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0A192F">
    {% if store_slug and admin_pwa_store_name %}
    <link rel="manifest" href="/admin-manifest/{{ store_slug | urlencode }}">
    <link rel="apple-touch-icon" href="/admin-icon/{{ store_slug | urlencode }}/192">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Admin - {{ admin_pwa_store_name }}">
    {% else %}
    <link rel="manifest" href="/static/manifest.json">
    {% endif %}
    <title>RT Studio | {% block title %}{% endblock %}</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --navy-gradient: linear-gradient(180deg, #374773 0%, #1A2238 100%);
            --navy-deep: #1A2238;
            --gold: #D4AF37;
            --gold-light: #F2C94C;
            --white: #FFFFFF;
            --gray-bg: #F4F7FA;
            --text-main: #2D3A5E;
            --text-muted: #8E9AAF;
            --border: rgba(0, 0, 0, 0.04);
            --sidebar-w: 260px;
            --sidebar-collapsed-w: 80px;
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow-card: 0 10px 40px rgba(0, 0, 0, 0.04);
            --shadow-premium: 0 20px 60px rgba(0, 0, 0, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--gray-bg); color: var(--text-main); min-height: 100vh; display: flex; letter-spacing: -0.02em; }

        /* --- Sidebar Desktop --- */
        .sidebar {
            width: var(--sidebar-w);
            background: var(--navy-gradient);
            height: 100vh;
            position: fixed;
            left: 0; top: 0;
            display: flex;
            flex-direction: column;
            z-index: 1000;
            transition: var(--transition);
        }

        .sidebar.collapsed { width: var(--sidebar-collapsed-w); }

        .logo-section {
            padding: 32px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }

        .logo-box {
            width: 36px; height: 36px;
            border-radius: 10px; overflow: hidden; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .logo-box img { width: 100%; height: 100%; object-fit: cover; }

        .lang-switcher-sidebar {
            margin: 0 16px 16px; display: flex;
            background: rgba(255,255,255,0.06);
            border-radius: 10px; padding: 4px; gap: 4px;
        }
        .lang-btn-sidebar {
            flex: 1; padding: 7px; border: none; border-radius: 8px;
            font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.3s;
            background: transparent; color: rgba(255,255,255,0.5);
        }
        .lang-btn-sidebar.active { background: var(--gold); color: #fff; }
        .sidebar.collapsed .lang-switcher-sidebar { display: none; }

        .logo-text {
            color: var(--white);
            font-size: 20px; font-weight: 700;
            letter-spacing: -0.5px;
            white-space: nowrap;
            transition: var(--transition);
        }

        .sidebar.collapsed .logo-text { opacity: 0; pointer-events: none; }

        .nav-menu {
            flex: 1;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
            white-space: nowrap;
            margin-bottom: 4px;
        }

        .nav-link i { width: 20px; height: 20px; opacity: 0.8; }
        .nav-link:hover { color: var(--white); background: rgba(255,255,255,0.08); }
        .nav-link.active { background: rgba(255,255,255,0.15); color: var(--white); font-weight: 600; backdrop-filter: blur(10px); }

        .sidebar.collapsed .nav-link span { display: none; }

        .sidebar-footer {
            padding: 24px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        /* --- Main Content --- */
        .main-wrapper {
            flex: 1;
            margin-left: var(--sidebar-w);
            transition: var(--transition);
            width: 100%;
        }

        .sidebar.collapsed + .main-wrapper { margin-left: var(--sidebar-collapsed-w); }

        .content-area {
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* --- Mobile Nav (Floating) --- */
        .mobile-nav {
            display: none;
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            padding: 10px 20px;
            border-radius: 30px;
            z-index: 2000;
            gap: 24px;
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            align-items: center;
        }

        .mob-link {
            color: #8E9AAF;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            transition: var(--transition);
        }

        .mob-link.active { color: #2D3A5E; }

        .mob-fab {
            width: 52px; height: 52px;
            background: var(--gold-light);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: var(--white);
            box-shadow: 0 8px 20px rgba(242, 201, 76, 0.4);
            margin: 0 -10px;
            transform: translateY(-5px);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-wrapper { margin-left: 0 !important; }
            .content-area { padding: 24px 16px; padding-bottom: 100px; }
            .mobile-nav { display: flex; }
        }

        /* PWA Banner (Gemini Style) */
        .pwa-toast {
            position: fixed; top: 20px; right: 20px;
            background: var(--white); padding: 16px;
            border-radius: 16px; display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            z-index: 3000; border: 1px solid var(--border);
            align-items: center; gap: 12px;
            animation: slideIn 0.5s ease;
        }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    </style>
</head>
<body>

    <!-- Sidebar Desktop -->
    <aside class="sidebar" id="mainSidebar">
        <div class="logo-section">
            <div class="logo-box">
                <img src="/static/rt_logo_512.png" alt="RT Studio">
            </div>
            <span class="logo-text">RT Studio</span>
        </div>

        <nav class="nav-menu">
            <a href="/dashboard" class="nav-link {% block nav_dashboard %}{% endblock %}">
                <i data-lucide="layout-dashboard"></i>
                <span data-ar="الرئيسية" data-en="Dashboard">الرئيسية</span>
            </a>
            <a href="/admin" class="nav-link {% block nav_products %}{% endblock %}">
                <i data-lucide="package"></i>
                <span data-ar="المنتجات" data-en="Inventory">المنتجات</span>
            </a>
            <a href="/store/{{ store_slug if store_slug else 'preview' }}" class="nav-link" target="_blank">
                <i data-lucide="external-link"></i>
                <span data-ar="المتجر" data-en="Public Store">المتجر</span>
            </a>
            <a href="/admin?active_tab=settings" class="nav-link {% block nav_settings %}{% endblock %}">
                <i data-lucide="settings"></i>
                <span data-ar="الإعدادات" data-en="Settings">الإعدادات</span>
            </a>
        </nav>

        <div class="lang-switcher-sidebar">
            <button class="lang-btn-sidebar active" id="btnAr" onclick="setLang('ar')">AR</button>
            <button class="lang-btn-sidebar" id="btnEn" onclick="setLang('en')">EN</button>
        </div>

        <div class="sidebar-footer">
            <a href="/logout" class="nav-link" style="color: #ef4444;">
                <i data-lucide="log-out"></i>
                <span data-ar="تسجيل الخروج" data-en="Logout">تسجيل الخروج</span>
            </a>
        </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
        <main class="content-area">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Mobile Nav (الشريط السفلي المطور) -->
    <nav class="mobile-nav">
        <a href="/dashboard" class="mob-link {% block mob_dashboard %}{% endblock %}">
            <i data-lucide="home"></i>
        </a>      
        
        <a href="/admin" class="mob-link">
            <i data-lucide="mail"></i>
        </a>

        <!-- زر الزائد المطور: يفتح الكاميرا أو معرض الصور فوراً -->
        <a href="javascript:void(0)" class="mob-fab" onclick="document.getElementById('globalFileInput').click()">
            <i data-lucide="plus" style="width: 28px; height: 28px;"></i>
        </a>
        
        <!-- نموذج مخفي للرفع السريع متاح في كل صفحات الموقع -->
        <form action="/" method="POST" enctype="multipart/form-data" id="globalUploadForm" style="display:none">
            <input type="file" id="globalFileInput" name="image" accept="image/*" onchange="document.getElementById('globalUploadForm').submit()">
        </form>

        <a href="/store/{{ store_slug if store_slug else 'preview' }}" class="mob-link">
            <i data-lucide="message-square"></i>
        </a>
        <a href="/admin?active_tab=settings" class="mob-link">
            <i data-lucide="settings"></i>
        </a>
        </nav>

    <!-- Lucide Init -->
    <script>
        lucide.createIcons();

        function toggleSidebar() {
            document.getElementById('mainSidebar').classList.toggle('collapsed');
        }

        // Language system
        const LANG_KEY = 'rt_lang';
        function setLang(lang) {
            localStorage.setItem(LANG_KEY, lang);
            applyLang(lang);
        }
        function applyLang(lang) {
            const isAr = lang === 'ar';
            document.documentElement.setAttribute('lang', lang);
            document.documentElement.setAttribute('dir', isAr ? 'rtl' : 'ltr');
            document.getElementById('btnAr').classList.toggle('active', isAr);
            document.getElementById('btnEn').classList.toggle('active', !isAr);
            document.querySelectorAll('[data-ar]').forEach(el => {
                el.textContent = isAr ? el.getAttribute('data-ar') : el.getAttribute('data-en');
            });
        }
        // Init on load
        const savedLang = localStorage.getItem(LANG_KEY) || 'ar';
        applyLang(savedLang);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(err => console.log('SW Failed', err));
            });
        }
    </script>
</body>
</html>
