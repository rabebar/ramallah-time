<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0A192F">
    <link rel="manifest" href="/static/manifest.json">
    <title>RT Studio | {% block title %}{% endblock %}</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --navy: #0A192F;
            --navy-light: #112240;
            --indigo: #4F46E5;
            --gold: #B8974A;
            --white: #FFFFFF;
            --gray-bg: #F8FAFC;
            --gray-100: #F1F5F9;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --border: rgba(0, 0, 0, 0.05);
            --sidebar-w: 260px;
            --sidebar-collapsed-w: 80px;
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            --glass: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.3);
            --shadow-premium: 0 20px 50px -12px rgba(0, 0, 0, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--gray-bg); color: var(--text-main); min-height: 100vh; display: flex; letter-spacing: -0.01em; }

        /* --- Sidebar Desktop --- */
        .sidebar {
            width: var(--sidebar-w);
            background: var(--navy);
            height: 100vh;
            position: fixed;
            left: 0; top: 0;
            display: flex;
            flex-direction: column;
            z-index: 1000;
            transition: var(--transition);
            border-right: 1px solid rgba(255,255,255,0.05);
        }

        .sidebar.collapsed { width: var(--sidebar-collapsed-w); }

        .logo-section {
            padding: 32px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }

        .logo-box {
            width: 36px; height: 36px;
            background: var(--gold);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; color: var(--navy); flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(184, 151, 74, 0.3);
        }

        .logo-text {
            color: var(--white);
            font-size: 20px; font-weight: 700;
            letter-spacing: -0.5px;
            white-space: nowrap;
            transition: var(--transition);
        }

        .sidebar.collapsed .logo-text { opacity: 0; pointer-events: none; }

        .nav-menu {
            flex: 1;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
            white-space: nowrap;
        }

        .nav-link i { width: 20px; height: 20px; }
        .nav-link:hover { color: var(--white); background: rgba(255,255,255,0.05); }
        .nav-link.active { background: var(--gold); color: var(--navy); font-weight: 600; box-shadow: 0 4px 15px rgba(184, 151, 74, 0.2); }

        .sidebar.collapsed .nav-link span { display: none; }

        .sidebar-footer {
            padding: 24px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        /* --- Main Content --- */
        .main-wrapper {
            flex: 1;
            margin-left: var(--sidebar-w);
            transition: var(--transition);
            width: 100%;
        }

        .sidebar.collapsed + .main-wrapper { margin-left: var(--sidebar-collapsed-w); }

        .content-area {
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* --- Mobile Nav (Floating) --- */
        .mobile-nav {
            display: none;
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            padding: 8px 12px;
            border-radius: 24px;
            z-index: 2000;
            gap: 8px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .mob-link {
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            padding: 12px;
            border-radius: 16px;
            transition: var(--transition);
        }

        .mob-link.active { color: var(--indigo); background: rgba(79, 70, 229, 0.08); }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-wrapper { margin-left: 0 !important; }
            .content-area { padding: 24px 16px; padding-bottom: 100px; }
            .mobile-nav { display: flex; }
        }

        /* PWA Banner (Gemini Style) */
        .pwa-toast {
            position: fixed; top: 20px; right: 20px;
            background: var(--white); padding: 16px;
            border-radius: 16px; display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            z-index: 3000; border: 1px solid var(--border);
            align-items: center; gap: 12px;
            animation: slideIn 0.5s ease;
        }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    </style>
</head>
<body>

    <!-- Sidebar Desktop -->
    <aside class="sidebar" id="mainSidebar">
        <div class="logo-section">
            <div class="logo-box">RT</div>
            <span class="logo-text">RT Studio</span>
        </div>

        <nav class="nav-menu">
            <a href="/" class="nav-link {% block nav_dashboard %}{% endblock %}">
                <i data-lucide="layout-dashboard"></i>
                <span>Dashboard</span>
            </a>
            <a href="/admin" class="nav-link {% block nav_products %}{% endblock %}">
                <i data-lucide="package"></i>
                <span>Inventory</span>
            </a>
            <a href="/store/{{ store_slug if store_slug else 'preview' }}" class="nav-link" target="_blank">
                <i data-lucide="external-link"></i>
                <span>Public Store</span>
            </a>
            <a href="/admin?active_tab=settings" class="nav-link {% block nav_settings %}{% endblock %}">
                <i data-lucide="settings"></i>
                <span>Settings</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <a href="/logout" class="nav-link" style="color: #ef4444;">
                <i data-lucide="log-out"></i>
                <span>Logout</span>
            </a>
        </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
        <main class="content-area">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Mobile Nav -->
    <nav class="mobile-nav">
        <a href="/" class="mob-link {% block mob_dashboard %}{% endblock %}">
            <i data-lucide="home"></i>
        </a>
        <a href="/admin" class="mob-link {% block mob_products %}{% endblock %}">
            <i data-lucide="package"></i>
        </a>
        <a href="/store/{{ store_slug if store_slug else 'preview' }}" class="mob-link">
            <i data-lucide="store"></i>
        </a>
        <a href="/admin?active_tab=settings" class="mob-link {% block mob_settings %}{% endblock %}">
            <i data-lucide="settings"></i>
        </a>
    </nav>

    <!-- Lucide Init -->
    <script>
        lucide.createIcons();
        
        // Sidebar Toggle logic can be added here if needed
        function toggleSidebar() {
            document.getElementById('mainSidebar').classList.toggle('collapsed');
        }
    </script>
</body>
</html>
