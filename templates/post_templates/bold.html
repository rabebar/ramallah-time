<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: transparent; }

        #post-canvas {
            width: 1080px;
            height: 1080px;
            font-family: 'Cairo', sans-serif;
            position: relative;
            overflow: hidden;
            background: #f7f3ee;
            display: flex;
        }

        .left-side {
            width: 55%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 40px;
        }

        .product-img {
            max-width: 95%;
            max-height: 900px;
            object-fit: contain;
            filter: drop-shadow(20px 0 60px rgba(0,0,0,0.15));
        }

        .right-side {
            width: 45%;
            height: 100%;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            padding: 60px 55px 60px 30px;
            position: relative;
        }

        .right-side::before {
            content: '';
            position: absolute;
            top: 0;
            left: -60px;
            width: 120px;
            height: 100%;
            background: #1a1a1a;
            transform: skewX(-4deg);
            transform-origin: bottom left;
        }

        .label {
            font-size: 20px;
            font-weight: 700;
            color: rgba(255,255,255,0.35);
            letter-spacing: 4px;
            margin-bottom: 25px;
            text-align: right;
            z-index: 1;
        }

        .product-title {
            font-size: 68px;
            font-weight: 900;
            color: #ffffff;
            line-height: 1.15;
            text-align: right;
            margin-bottom: 40px;
            z-index: 1;
        }

        .divider {
            width: 80px;
            height: 6px;
            background: #ffffff;
            border-radius: 3px;
            margin-bottom: 40px;
            z-index: 1;
        }

        .price-box {
            background: #ffffff;
            color: #1a1a1a;
            font-size: 52px;
            font-weight: 900;
            padding: 20px 45px;
            border-radius: 16px;
            z-index: 1;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }
    </style>
</head>
<body>
<div id="post-canvas">

    <div class="left-side">
        <img class="product-img" src="{{ product_image }}" alt="">
    </div>

    <div class="right-side">
        <div class="label">RAMALLAH TIME</div>
        <div class="product-title">{{ product_name }}</div>
        <div class="divider"></div>
        <div class="price-box">{{ product_price }} ₪</div>
    </div>

</div>
</body>
</html>
