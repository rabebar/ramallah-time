<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: transparent; }

        #post-canvas {
            width: 1080px;
            height: 1080px;
            background: linear-gradient(160deg, #1a1a1a 0%, #2d2d2d 100%);
            font-family: 'Cairo', sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* خط عمودي زخرفي */
        .accent-line {
            position: absolute;
            top: 60px;
            right: 60px;
            width: 6px;
            height: 120px;
            background: #ffffff;
            border-radius: 3px;
        }

        /* اسم المنتج أعلى اليمين */
        .product-title {
            position: absolute;
            top: 60px;
            right: 90px;
            font-size: 72px;
            font-weight: 900;
            color: #ffffff;
            line-height: 1.2;
            max-width: 550px;
            text-align: right;
        }

        /* صورة المنتج في المنتصف مائلة قليلاً للجانب */
        .product-img {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 700px;
            max-height: 700px;
            object-fit: contain;
            filter: drop-shadow(0 40px 80px rgba(255,255,255,0.08));
        }

        /* السعر pill أبيض أسفل اليسار */
        .price-pill {
            position: absolute;
            bottom: 60px;
            left: 60px;
            background: #ffffff;
            color: #111111;
            font-size: 48px;
            font-weight: 900;
            padding: 18px 50px;
            border-radius: 100px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        /* علامة مائية */
        .watermark {
            position: absolute;
            bottom: 30px;
            right: 60px;
            font-size: 18px;
            color: rgba(255,255,255,0.1);
            letter-spacing: 5px;
            font-weight: 700;
        }
    </style>
</head>
<body>
<div id="post-canvas">
    <div class="accent-line"></div>
    <div class="product-title">{{ product_name }}</div>
    <img class="product-img" src="{{ product_image }}" alt="">
    <div class="price-pill">{{ product_price }} شيقل</div>
    <div class="watermark">RAMALLAH TIME</div>
</div>
</body>
</html>
