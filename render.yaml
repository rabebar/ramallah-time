services:
  # 1. إعداد السيرفر (Web Service)
  - type: web
    name: ramallah-time-app
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --timeout 300 app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ramallah-time-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: MASTER_PASSWORD
        sync: false

databases:
  # 2. إعداد قاعدة البيانات (PostgreSQL)
  - name: ramallah-time-db
    plan: free
    region: frankfurt
